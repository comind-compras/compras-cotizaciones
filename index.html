<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras · Cotizaciones · Comind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#314147;--ink:#26343a;--muted:#7b878c;--lav:#f2f2f5;--line:#e4e6e9;--link:#e44400;--green:#e44400;--head:#e6e8ea;
--c-white:#ffffff;--c-yellow:#FFE599;--c-green:#B6D7A8;--c-red:#EA9999}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:28px;min-height:100vh;font:14px/1.45 "Plus Jakarta Sans","Inter","Segoe UI",system-ui,sans-serif;color:var(--ink);
background:linear-gradient(135deg,#3f5963 0%,#314147 48%,#222d32 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:80px minmax(0,1fr);background:#fff;border-radius:22px;overflow:hidden;min-height:calc(100vh - 56px);box-shadow:0 24px 70px rgba(35,45,140,.28)}
/* sidebar */
.side{display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;border-right:1px solid #f0f4f6;background:#fff}
.logo{width:44px;height:44px;margin-bottom:18px}
.nav{width:46px;height:46px;border-radius:14px;border:0;background:none;color:#385059;display:grid;place-items:center;position:relative}
.nav:hover{background:#f4f7f8}
.nav.active{box-shadow:inset 3px 0 0 #e44400;background:#ecf1f3;color:var(--navy)}
.nav .tip{position:absolute;left:58px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s;z-index:30}
.nav:hover .tip{opacity:1;transform:none}
.nav .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:9px;background:#e5706f;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sep{width:30px;height:1px;background:#ebf0f2;margin:10px 0}
.main{display:flex;flex-direction:column;min-width:0;background:var(--lav)}
.topbar{height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px;flex:none}
.crumb{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
.crumb span.sep2{opacity:.7}
.tops{display:flex;gap:6px;align-items:center}
.tops button{background:none;border:0;color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px}
.tops button:hover{background:#ffffff1c}
.pagehead{background:#fff;padding:26px 40px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #eef3f5}
.pagehead h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.5px}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pact{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;border:1px solid #e3eaed;background:#fff;color:var(--ink);position:relative;white-space:nowrap;transition:.12s}
.btn:hover{background:#f8fafa}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:#c43a00}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.dark:hover{background:#3f5963}
.btn.sm{padding:8px 16px;font-size:13px}
.btn.xs{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:#b4372f}
.badge{position:absolute;top:-8px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#e5706f;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.content{padding:28px 40px 40px;flex:1;min-width:0}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-bottom:22px}
.stat{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid transparent;border-radius:14px;padding:16px 18px;text-align:left;box-shadow:0 2px 10px #2a368c0d;font-weight:600;font-size:15px}
.stat:hover{box-shadow:0 4px 16px #2a368c1c}
.stat.active{border-color:var(--navy)}
.stat .n{width:46px;height:46px;border-radius:50%;border:1.5px solid #e0e8ec;display:grid;place-items:center;font-size:20px;font-weight:600;color:#c98d1c;flex:none;background:#fff}
.stat.all .n{color:#7096a5}
.stat.white .n{color:#7e929a;border-color:#d2dee3}
.stat.yellow .n{border-color:var(--c-yellow);color:#a67c00;background:#fff9e3}
.stat.green .n{border-color:var(--c-green);color:#3d7a31;background:#f1f8ee}
.stat.red .n{border-color:var(--c-red);color:#a63c3c;background:#fceeee}
/* filter bar */
.bar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 0 0 14px;height:62px;margin-bottom:22px;box-shadow:0 2px 10px #2a368c0d;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:999px;height:36px;padding:0 14px;font-weight:600;font-size:14px}
.pill.round{width:36px;padding:0;justify-content:center}
.pill.off{background:#ebf0f2;color:#5e7882}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);height:100%;padding:0 22px;width:min(380px,48%);color:#9eb1b9}
.search input{border:0;outline:0;font:inherit;font-size:15px;width:100%;background:none;color:var(--ink)}
.pop{position:absolute;top:68px;left:14px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 18px 40px #1f286033;display:grid;grid-template-columns:repeat(2,minmax(170px,1fr));gap:12px 14px;width:min(520px,94%)}
.pop .full{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
input.in,select.in,textarea.in{font:inherit;font-size:14px;font-weight:500;color:var(--ink);border:1px solid #dde6ea;border-radius:10px;padding:10px 12px;background:#fff;width:100%;min-width:0;outline:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:#9eb7c1;box-shadow:0 0 0 3px #7f8de026}
/* table */
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #2a368c0d}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1060px}
th{background:var(--head);text-align:left;font-size:13px;font-weight:700;color:#31454d;padding:18px 14px;white-space:nowrap;position:sticky;top:0}
th .sb{background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:inherit}
th .sb svg{width:14px;height:14px;opacity:.7}
td{padding:16px 14px;border-bottom:1px solid #f0f4f6;vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{padding-left:20px}
tbody tr{background:#fff}
tbody tr.r-green{background:#B6D7A840}
tbody tr.r-yellow{background:#FFE59959}
tbody tr.r-red{background:#EA999947}
tbody tr.r-green td:first-child,tbody tr.r-yellow td:first-child,tbody tr.r-red td:first-child,tbody tr.r-white td:first-child{box-shadow:inset 5px 0 0 var(--bar,#fff)}
tbody tr.r-green{--bar:var(--c-green)}tbody tr.r-yellow{--bar:var(--c-yellow)}tbody tr.r-red{--bar:var(--c-red)}tbody tr.r-white{--bar:#dbe5e9}
tbody tr:hover{filter:brightness(.985)}
.vs{color:var(--link);font-weight:700;font-size:15px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.strong{font-weight:700}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;max-width:250px}
.tag{display:inline-block;border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600;background:#e6ecef;color:#51727f;white-space:nowrap}
.tag.white{background:#fff;color:#627780;box-shadow:inset 0 0 0 1px #d4dfe3}
.tag.yellow{background:var(--c-yellow);color:#6b5000}
.tag.green{background:var(--c-green);color:#25531c}
.tag.red{background:var(--c-red);color:#7a1f1f}
.tag.amber{background:#fdf0d6;color:#b47a12}
.tag.ok{background:#d8f1dc;color:#2e8b3a}
.tag.warn{background:#fde2dc;color:#b3402c}
.tag.gray{background:#eef2f4;color:#627780}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef2f4;color:#4f707e;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}
.chip.sent{background:#d8f1dc;color:#2e7d37}
.chip.ghost{background:#fff;color:#728e9a;border:1px dashed #becfd6;cursor:pointer}
.chip.ghost:hover{background:#f5f7f8}
.chip button{border:0;background:none;padding:0;display:grid;place-items:center;color:inherit;opacity:.7}
.chip button:hover{opacity:1}
.acts{display:flex;gap:8px;justify-content:flex-end}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:#f0f4f5;color:#71868f;display:grid;place-items:center}
.ib:hover{background:#e4ebee;color:var(--navy)}
.ib.ok{color:#2e8b3a}.ib.no{color:#b3402c}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:20px 8px 4px;flex-wrap:wrap;color:#859aa3;font-weight:600}
.pager .pn{width:38px;height:38px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;font-weight:600;color:#385059;font-size:14px;box-shadow:0 1px 4px #2a368c14}
.pager .pn.active{background:var(--navy);color:#fff}
.pager .pn:disabled{opacity:.35}
.pager select{border:0;background:#fff;border-radius:999px;height:38px;padding:0 12px;font:inherit;font-weight:600;color:#385059}
.sel{width:18px;height:18px;accent-color:var(--navy)}
/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(860px,94vw);max-height:92vh;box-shadow:0 30px 90px #12185a55;color:var(--ink);font:inherit;overflow:hidden}
dialog::backdrop{background:#161c4d77;backdrop-filter:blur(2px)}
dialog[open]{display:flex;flex-direction:column}
dialog.sm{width:min(520px,94vw)}
dialog.lg{width:min(980px,95vw)}
.dh{padding:22px 28px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:22px;font-weight:800}
.dh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.db{padding:20px 28px;overflow:auto;flex:1;background:#fbfcfd}
.df{padding:16px 28px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid .w2{grid-column:span 2}.grid .w4{grid-column:span 4}
details.more{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:#fff}
details.more summary{padding:13px 16px;font-weight:700;cursor:pointer}
details.more .grid{padding:4px 16px 16px}
.note{background:#f3f6f8;border:1px solid #dfe7ea;color:#4f707e;border-radius:12px;padding:12px 14px;font-size:13px}
.note.warn{background:#fff6e2;border-color:#f3dba3;color:#8a5d00}
.sec{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.mail{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.mail.done{border-color:#bfe3c5;background:#f6fcf7}
.mail header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.mail h3{margin:0;font-size:17px;font-weight:800}
.mail pre{margin:0;padding:14px 18px;background:#f8fafa;border-top:1px solid var(--line);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:210px;overflow:auto;color:#354c55}
.mail .row{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.mail .to{display:flex;align-items:center;gap:8px;flex:1;min-width:230px}
.pickl{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.pickl label{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f2f6f7;cursor:pointer}
.pickl label:hover{background:#f8fafb}
.pickl label:last-child{border:0}
.legend{display:grid;gap:10px}
.legend div{display:flex;gap:12px;align-items:center}
.sw{width:26px;height:26px;border-radius:8px;border:1px solid #0001;flex:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px #2a368c0d}
.panel h3{margin:0 0 6px;font-size:17px;font-weight:800}
.panel p{margin:0 0 14px;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:900px){
 body{padding:0}
 .app{border-radius:0;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100vh}
 .side{flex-direction:row;justify-content:center;padding:8px;border-right:0;border-bottom:1px solid #f0f4f6;gap:4px}
 .logo{margin:0 10px 0 0;width:36px;height:36px}.sep{display:none}
 .nav .tip{display:none}
 .pagehead{padding:18px 16px}.pagehead h1{font-size:26px}.content{padding:18px 14px 30px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .w4{grid-column:span 2}
 .tops button span{display:none}.search{width:55%;padding:0 12px}
 .btn{padding:10px 16px;font-size:14px}
}
</style></head><body>

<script>
"use strict";
const $=s=>document.querySelector(s);
const norm=v=>String(v??"").trim().toLowerCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

 <button class="pn" ${page<=1?"disabled":""} data-act="pg" data-k="${key}" data-p="${page-1}" aria-label="Anterior">${ic("left","s")}</button>
 ${ps.map(p=>p==="…"?"<span>…</span>":`<button class="pn ${p===page?"active":""}" data-act="pg" data-k="${key}" data-p="${p}">${p}</button>`).join("")}

function sortRecs(arr){const {k,d}=U.sort;return arr.slice().sort((a,b)=>{let x=a[k],y=b[k];if(k==="VS"){x=Number(x)||0;y=Number(y)||0;return(x-y)*d||(a.seq-b.seq)*d}if(k==="seq")return(x-y)*d;return String(x??"").localeCompare(String(y??""),"es")*d})}
function chips(r,editable){const as=r.asignados||[];return as.map(s=>{const sent=(r.enviados||{})[s];return `<span class="chip ${sent?"sent":""}" title="${sent?"Enviado el "+fmtD(sent):"Pendiente de enviar"}">${sent?ic("check","s"):""}${esc(s)}${editable?`<button data-act="unassign" data-id="${r.id}" data-s="${esc(s)}" aria-label="Quitar">${ic("x","s")}</button>`:""}</span>`}).join("")}

function buildGroups(ids,resend){const g=new Map(),sin=[];ids.forEach(id=>{const r=byId(id);if(!r)return;const as=r.asignados||[];if(!as.length){sin.push(r);return}as.forEach(s=>{if(!resend&&(r.enviados||{})[s])return;if(!g.has(s))g.set(s,[]);g.get(s).push(r)})});return{g,sin}}
function emailText(items,sn){const mode=(supByName(sn)||{}).entrega||"",one=items.length===1;let t=`Estimados,\n\nJunto con saludar, solicito cotizar ${one?"el siguiente material":"los siguientes materiales"}:\n\n`;
 const dests=[...new Set(items.map(destOf))],same=mode==="DESPACHO"&&dests.length===1&&dests[0];
 t+=items.map((r,i)=>{const p=one?"":"   ",h=one?"":`${i+1}) `;return `${h}Material: ${r.DESC}\n${p}Cantidad: ${r.CANT}`+(r.OBS?`\n${p}Observaciones: ${r.OBS}`:"")+(mode==="DESPACHO"&&!same&&destOf(r)?`\n${p}Dirección de despacho: ${sedeTxt(destOf(r))}`:"")}).join("\n\n");
 t+=`\n\nAgradeceré indicar precio, disponibilidad y plazo de entrega.`;
 if(same)t+=`\n\nEl despacho debe realizarse a la siguiente dirección: ${sedeTxt(dests[0])}`;
 else if(mode==="RETIRO")t+=`\n\nEl retiro lo realizaremos nosotros en sus instalaciones.`;
 t+=`\n\nSaludos.`;if(DB.settings.firma)t+=`\n${DB.settings.firma}`;return t}
const subjectFor=items=>{const v=[...new Set(items.map(r=>r.VS).filter(x=>x!==""&&x!=null))];return "Solicitud de cotización de materiales"+(v.length?` · V/S ${v.slice(0,6).join(" / ")}${v.length>6?"…":""}`:"")};

 if(!dlg.open)dlg.showModal()}
function mailCard(s){const items=MAILS.g.get(s),sup=supByName(s)||{name:s,email:""},body=emailText(items,s),done=items.every(r=>(r.enviados||{})[s]);

const mkey=n=>strip(n).replace(/\s+/g," ");
function splitCSV(l,sep){const r=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"'&&c===""){q=true}else if(ch===sep){r.push(c);c=""}else c+=ch}r.push(c);return r}

 if(out.length&&/^(material(es)?|descripci[oó]n|descripcion|nombre|detalle)$/i.test(out[0].name))out.shift();return out}

function exportCSV(){const q=(s)=>'"'+String(s??"").replace(/"/g,'""')+'"';const ESTN={white:"BLANCO",yellow:"AMARILLO",green:"VERDE",red:"ROJO"};
 const arr=U.view==="compras"?sortRecs(filtered()):DB.records.slice().sort((a,b)=>a.seq-b.seq);
 const csv=[["COLOR",...COLS.map(c=>c[1]),"PROVEEDORES A COTIZAR","ENVIADOS"].join(";"),...arr.map(r=>[ESTN[r.estado],...COLS.map(([k])=>k==="FECHA"?fmtD(r[k]):r[k]),(r.asignados||[]).join(" / "),Object.entries(r.enviados||{}).map(([s,d])=>s+" "+fmtD(d)).join(" / ")].map(q).join(";"))].join("\r\n");
 download("﻿"+csv,"compras_materiales.csv","text/csv;charset=utf-8");toast(`Exportados ${arr.length} registros`)}

/* ---------- copiar para Google Sheets ---------- */
function sheetData(arr){const BG={white:"#ffffff",yellow:"#FFE599",green:"#B6D7A8",red:"#EA9999"},ESTN={white:"BLANCO",yellow:"AMARILLO",green:"VERDE",red:"ROJO"};
 const head=[...COLS.map(c=>c[1]),"PROVEEDORES A COTIZAR","ENVIADOS"];
 const rows=arr.map(r=>({bg:BG[r.estado]||"#ffffff",cells:[...COLS.map(([k])=>k==="FECHA"?fmtD(r[k]):r[k]),(r.asignados||[]).join(" / "),Object.entries(r.enviados||{}).map(([s,d])=>s+" "+fmtD(d)).join(" / ")].map(v=>String(v??"").replace(/\s*[\r\n\t]+\s*/g," ").trim())}));
 const tsv=[head,...rows.map(r=>r.cells)].map(a=>a.join("\t")).join("\n");
 const html=`<table><thead><tr>${head.map(h=>`<th style="background-color:#314147;color:#ffffff;font-weight:bold">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.cells.map(c=>`<td style="background-color:${r.bg}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
 return{tsv,html,n:arr.length}}
async function copySheets(){const arr=U.view==="compras"?sortRecs(filtered()):DB.records.slice().sort((a,b)=>a.seq-b.seq);const {tsv,html,n}=sheetData(arr);let ok=false;
 try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([tsv],{type:"text/plain"})})]);ok=true}catch(e){}
 if(!ok){const d=document.createElement("div");d.contentEditable="true";d.style.cssText="position:fixed;left:-9999px;top:0";d.innerHTML=html;document.body.appendChild(d);const rg=document.createRange();rg.selectNodeContents(d);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);try{ok=document.execCommand("copy")}catch(x){}sl.removeAllRanges();d.remove()}
 if(!ok){download("\uFEFF"+tsv,"compras_materiales.tsv","text/tab-separated-values;charset=utf-8");toast("No se pudo copiar. Se descargó un archivo: en Sheets usa Archivo > Importar");return}
 toast(`${n} registros copiados. En tu Google Sheet: clic en A1 y Ctrl+V`)}

/* ---------- eventos ---------- */
const ACT={
 go:d=>go(d.v),
 help:()=>{const dlg=$("#dlg");dlg.className="sm";dlg.innerHTML=`<div class="dh"><div><h2>Cómo funciona</h2></div><button class="ib" data-act="closeDlg">${ic("x","s")}</button></div><div class="db"><div class="sec">Colores</div>${legend()}<div class="sec" style="margin-top:20px">Flujo de cotización</div><ol style="margin:0;padding-left:20px;line-height:1.8"><li>Crea la solicitud (<b>Nueva solicitud</b>).</li><li>En <b>Cotizar</b>, asigna uno o varios proveedores a cada material.</li><li><b>Preparar correos</b>: se genera un correo individual por proveedor con todos sus materiales.</li><li>Ábrelo en Outlook, envíalo y marca <b>enviado</b>.</li><li>Cuando respondan, abre el material y completa proveedor elegido, OC y recepción.</li></ol></div><div class="df"><button class="btn dark" data-act="closeDlg">Entendido</button></div>`;dlg.showModal()},
 closeDlg:()=>$("#dlg").close(),closePick:()=>$("#dlgPick").close(),
 pg:d=>{const k=d.k;U[k]=Number(d.p);({page:fillCompras,cpage:fillCotizar,spage:fillProv,mpage:fillMat})[k]()},
 sort:d=>{U.sort=U.sort.k===d.k?{k:d.k,d:-U.sort.d}:{k:d.k,d:d.k==="estado"||d.k==="DESC"||d.k==="PROV"?1:-1};fillCompras()},
 estado:d=>{U.estado=d.k;U.page=1;viewCompras()},
 hideRed:()=>{U.hideRed=!U.hideRed;U.page=1;viewCompras()},
 togglePop:()=>$("#pop").classList.toggle("hidden"),
 clearF:()=>{U.f={prov:"",op:"",entrega:"",sede:""};U.page=1;viewCompras()},
 sendOC:d=>openOC(d.id),
 ocRm:d=>{OCM.files.splice(Number(d.i),1);updOC()},
 ocCopy:async()=>{try{await navigator.clipboard.writeText(`Asunto: ${subjectOC()}\n\n${emailTextOC()}`);toast("Texto copiado")}catch(e){toast("No se pudo copiar")}},
 ocMailto:()=>{const to=($("#ocTo").value||ocTo()).split(/[;,]\s*/).filter(Boolean).join(",");const a=document.createElement("a");a.href=`mailto:${to}?subject=${encodeURIComponent(subjectOC())}&body=${encodeURIComponent(emailTextOC().replace(/\n/g,"\r\n"))}`;document.body.appendChild(a);a.click();a.remove();toast("Adjunta el PDF a mano o usa el borrador con adjunto")},
 ocEml:async()=>{if(!OCM.files.length&&!confirm("No elegiste ningún archivo. ¿Descargar el borrador sin adjunto?"))return;download(await emlOC(),"OC_"+String(OCM.items[0].OC).replace(/\W+/g,"_")+".eml","message/rfc822");toast("Borrador descargado: ábrelo con Outlook")},
 ocSent:()=>{OCM.items.forEach(r=>r.ocEnviada=today());save();$("#dlg").close();toast("OC marcada como enviada");render()},
 newRec:()=>openForm(null),edit:d=>openForm(d.id),
 del:d=>{const r=byId(d.id);if(r&&confirm(`¿Eliminar "${r.DESC}"? No se puede deshacer.`)){DB.records=DB.records.filter(x=>x.id!==d.id);U.sel.delete(d.id);save();render()}},
 cfilter:d=>{U.cfilter=d.k;U.cpage=1;viewCotizar()},
 sel:(d,t)=>{t.checked?U.sel.add(d.id):U.sel.delete(d.id);fillCotizar()},
 selAll:(d,t)=>{const rows=cotizarList().slice((U.cpage-1)*15,U.cpage*15);rows.forEach(r=>t.checked?U.sel.add(r.id):U.sel.delete(r.id));fillCotizar()},
 bulkAssign:()=>pickFor([...U.sel]),
 pick1:d=>pickFor([d.id]),
 assignOne:d=>{const r=byId(d.id);r.asignados=[...(r.asignados||[]),d.s];save();fillCotizar();updateDot()},
 unassign:d=>{const r=byId(d.id);r.asignados=(r.asignados||[]).filter(x=>x!==d.s);if(r.enviados)delete r.enviados[d.s];save();fillCotizar()},
 prepare:()=>{const sel=[...U.sel].filter(id=>byId(id)&&byId(id).estado==="white");openPrepare(sel.length?sel:pendientes().map(r=>r.id))},
 quote1:d=>{const r=byId(d.id);if(!(r.asignados||[]).length){pickSuppliers({title:"¿A quién cotizar?",sub:r.DESC,suggestions:suggest(r),onOk:l=>{if(!l.length)return;r.asignados=l;save();openPrepare([r.id],true)}});return}openPrepare([d.id],true)},
 resend:(d,t)=>openPrepare(MAILS.ids,t.checked),
 openMail:d=>{const url=mailURL(d.s);if(url.length>1900){download(emlFor(d.s),"cotizacion_"+d.s.replace(/\W+/g,"_")+".eml","message/rfc822");toast("Correo largo: se descargó un borrador .eml, ábrelo con Outlook")}else{const a=document.createElement("a");a.href=url;document.body.appendChild(a);a.click();a.remove()}},
 copyMail:async d=>{const t=`Asunto: ${subjectFor(MAILS.g.get(d.s))}\n\n${emailText(MAILS.g.get(d.s),d.s)}`;try{await navigator.clipboard.writeText(t);toast("Texto copiado")}catch(e){toast("No se pudo copiar")}},
 emlMail:d=>download(emlFor(d.s),"cotizacion_"+d.s.replace(/\W+/g,"_")+".eml","message/rfc822"),
 sentMail:d=>{markSent(d.s);refreshMail(d.s);toast(`Marcado como enviado: ${d.s}`)},
 markAll:()=>{[...MAILS.g.keys()].forEach(s=>markSent(s));openPrepare(MAILS.ids,MAILS.resend);if(U.view==="cotizar")fillCotizar()},
 formPick:()=>pickSuppliers({title:"Proveedores a cotizar",sub:"Cada uno recibe su propio correo",selected:FORM.asignados,onOk:l=>{FORM.asignados=l;FORM.auto=false;drawFormChips()}}),
 formUn:d=>{FORM.asignados=FORM.asignados.filter(x=>x!==d.s);FORM.auto=false;drawFormChips()},
 sedes:sedesDialog,newSup:()=>supDialog(null),editSup:d=>supDialog(d.s),
 delSup:d=>{if(confirm(`¿Eliminar a ${d.s} de la base? Los registros no se borran.`)){DB.suppliers=DB.suppliers.filter(s=>s.name!==d.s);save();fillProv()}},
 newMat:()=>matDialog(null),
 delMat:d=>{const n=decodeURIComponent(d.n);if(confirm("¿Eliminar este material del catálogo?")){DB.materials=DB.materials.filter(m=>m.name!==n);save();fillMat()}},
 editMat:d=>matDialog(decodeURIComponent(d.n)),
 impMat:()=>impDialog(),
 expMat:()=>{const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';const rows=DB.materials.slice().sort((a,b)=>a.name.localeCompare(b.name,"es"));download("\uFEFF"+["Material;Unidad",...rows.map(m=>q(m.name)+";"+q(m.unit))].join("\r\n"),"materiales_"+today()+".csv","text/csv;charset=utf-8");toast(`Exportados ${rows.length} materiales`)},
 dedupMat:()=>{const g=new Map();DB.materials.forEach(m=>{const k=mkey(m.name);(g.get(k)||g.set(k,[]).get(k)).push(m)});const dups=[...g.values()].filter(a=>a.length>1);if(!dups.length){toast("No hay materiales repetidos (ignorando mayúsculas y espacios)");return}const extra=dups.reduce((n,a)=>n+a.length-1,0);if(!confirm(`Hay ${dups.length} material(es) repetido(s) (${extra} entradas sobrantes). Se deja una sola de cada uno, preferentemente la escrita en MAYÚSCULAS. ¿Continuar?`))return;const drop=new Set();dups.forEach(a=>{const best=a.slice().sort((x,y)=>(y.name===y.name.toUpperCase())-(x.name===x.name.toUpperCase())||(!!y.unit)-(!!x.unit))[0];a.forEach(m=>{if(m!==best){if(!best.unit&&m.unit)best.unit=m.unit;drop.add(m)}})});DB.materials=DB.materials.filter(m=>!drop.has(m));save();fillMat();toast(`Se eliminaron ${drop.size} duplicados`)},
 cloudLogin:async()=>{const url=$("#cUrl").value.trim(),key=$("#cKey").value.trim(),em=$("#cEmail").value.trim(),pw=$("#cPass").value;if(!url||!key||!em||!pw){toast("Completa URL, clave, correo y contraseña");return}CL.url=url;CL.key=key;try{await cAuth({email:em,password:pw},"password");CL.email=em;cSave();await cAfterLogin();cStat("ok");render()}catch(e){CL.refresh="";CL.access="";toast("No se pudo conectar: "+e.message)}},
 cloudPush:async()=>{try{cStat("pending");const r=await cPush(false);if(r==="ok"){cStat("ok");toast("Sincronizado");render()}else cConflict()}catch(e){cStat("err");toast("Error: "+e.message)}},
 cloudPull:async()=>{if(!confirm(CL.dirty?"Hay cambios de este equipo sin subir que se perderán. ¿Descargar de la nube igual?":"Se reemplazan los datos de este equipo por los de la nube. ¿Continuar?"))return;try{toast(await cPull()?"Datos descargados de la nube":"La nube aún no tiene datos");cStat("ok")}catch(e){toast("Error: "+e.message)}},
 cloudUse:async()=>{$("#dlgPick").close();try{await cPull();cStat("ok");toast("Datos descargados de la nube")}catch(e){toast("Error: "+e.message)}},
 cloudForce:async()=>{$("#dlgPick").close();try{await cPush(true);cStat("ok");toast("La nube ahora tiene los datos de este equipo");render()}catch(e){toast("Error: "+e.message)}},
 cloudOut:()=>{CL.access="";CL.refresh="";CL.exp=0;cSave();cStat("off");render()},
 cloudAuto:(d,t)=>{CL.auto=t.checked;cSave();if(CL.auto&&CL.dirty)cSched()},
 copySheets, exportCSV,  expJSON:()=>download(JSON.stringify({version:2,exportedAt:new Date().toISOString(),...DB},null,1),"respaldo_compras_"+today()+".json","application/json"),
 reset:()=>{if(confirm("Se reemplazan todos los datos por los del Excel original (y, si la nube está conectada, también lo que hay allá). ¿Continuar?")){DB=JSON.parse(JSON.stringify(SEED));ensureSettings();save();toast("Datos restaurados");render()}}
};
document.addEventListener("click",e=>{
 const pop=$("#pop");if(pop&&!pop.classList.contains("hidden")&&!e.target.closest("#pop,[data-act=togglePop]"))pop.classList.add("hidden");
 const t=e.target.closest("[data-act]");if(!t||t.tagName==="INPUT"&&t.type==="checkbox"&&e.type==="click"&&false)return;
 if(t.tagName==="INPUT")return; ACT[t.dataset.act]?.(t.dataset,t,e)});
document.addEventListener("change",e=>{const t=e.target;if(t.tagName==="INPUT"&&t.dataset.act)ACT[t.dataset.act]?.(t.dataset,t,e);
 const b=t.dataset?.bind;if(!b)return;
 if(b==="size"){U.size=Number(t.value);U.page=1;fillCompras()}
 else if(b.startsWith("f.")){U.f[b.slice(2)]=t.value;U.page=1;const pop=$("#pop");const open=!pop.classList.contains("hidden");viewCompras();if(open)$("#pop").classList.remove("hidden")}
 else if(b==="ment"){let sp=supByName(t.dataset.s);if(!sp){sp={name:t.dataset.s,email:"",phone:"",entrega:""};DB.suppliers.push(sp)}sp.entrega=t.value;save();refreshMail(t.dataset.s)}
 else if(b==="mdest"){if(t.value!=="__mix"){MAILS.g.get(t.dataset.s).forEach(r=>r.DEST=t.value);save();refreshMail(t.dataset.s)}}
 else if(b==="supmail"){const s=supByName(t.dataset.s);if(s){s.email=t.value.trim();save()}else{DB.suppliers.push({name:t.dataset.s,email:t.value.trim(),phone:""});save()}}});
document.addEventListener("input",e=>{const b=e.target.dataset?.bind;if(!b)return;
 if(b==="q"){U.q=e.target.value;U.page=1;fillCompras()}
 if(b==="cq"){U.cq=e.target.value;U.cpage=1;fillCotizar()}
 if(b==="sq"){U.sq=e.target.value;U.spage=1;fillProv()}
 if(b==="mq"){U.mq=e.target.value;U.mpage=1;fillMat()}});
render();cStat(cOn()?"ok":"off");cCheck();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")cCheck()});
</script></body></html>
